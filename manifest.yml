modules:
  jira:issuePanel:
    - key: canon-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Canon
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  confluence:contentBylineItem:
    - key: canon-byline
      resource: byline
      resolver:
        function: resolver
      render: native
      title: Canon
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
    - key: page-events
      handler: index.onPageEvent
    - key: issue-events
      handler: index.onIssueUpdated
    - key: canon-gate-fn
      handler: index.canonGate
    - key: rovo-get-gate-status
      handler: index.getGateStatus
    - key: rovo-explain-delta
      handler: index.explainDelta
    - key: rovo-approved-proc
      handler: index.getApprovedProcedure
    - key: rovo-create-checklist
      handler: index.createReattestChecklist
    - key: rovo-assign-checker
      handler: index.assignChecker
    - key: canon-reconcile-fn
      handler: index.runReconcile
  scheduledTrigger:
    - key: canon-reconcile
      function: canon-reconcile-fn
      interval: fiveMinute
  action:
    - key: canon-get-gate-status
      name: Get Canon gate status
      function: rovo-get-gate-status
      actionVerb: GET
      description: Returns whether the current Jira work item is bound to a Confluence procedure version and whether that procedure has been revised since (overall NO_BINDING, CLEAR, BLOCKED, WARN_ONLY, CLOSED or UNVERIFIED, with per-binding detail).
      inputs:
        note:
          title: Note
          type: string
          required: false
          description: Optional free text; ignored
    - key: canon-explain-delta
      name: Explain Canon delta
      function: rovo-explain-delta
      actionVerb: GET
      description: Lists what changed in the bound procedure since this work item was bound, with before/after text.
      inputs:
        note:
          title: Note
          type: string
          required: false
          description: Optional free text; ignored
    - key: canon-get-approved-procedure
      name: Get approved procedure
      function: rovo-approved-proc
      actionVerb: GET
      description: Returns the text of the current approved version of the bound procedure. Never returns draft text.
      inputs:
        version:
          title: Version
          type: integer
          required: false
          description: Optional version number; omit for the current approved version
    - key: canon-create-reattest-checklist
      name: Create re-attestation checklist
      function: rovo-create-checklist
      actionVerb: CREATE
      description: Creates or updates the re-attestation checklist for this work item with suggested tasks for the given delta items. Use only after the user confirms. Never marks items done.
      inputs:
        itemIdsJson:
          title: Item ids
          type: string
          required: true
          description: JSON array of delta item ids from canon-explain-delta
        tasksJson:
          title: Tasks
          type: string
          required: true
          description: JSON array of short task texts in the same order as itemIdsJson
        bindingId:
          title: Binding id
          type: string
          required: false
          description: Optional binding id; omit when only one binding needs re-attestation
    - key: canon-assign-checker
      name: Assign checker
      function: rovo-assign-checker
      actionVerb: UPDATE
      description: Assigns the independent checker for the re-attestation of this work item. Only the implementer can do this, and only after the user confirms.
      inputs:
        checkerAccountId:
          title: Checker account id
          type: string
          required: true
          description: Atlassian account id of the checker
        bindingId:
          title: Binding id
          type: string
          required: false
          description: Optional binding id; omit when only one binding is being re-attested
  rovo:agent:
    - key: canon-agent
      name: Canon Procedure Guard
      description: Explains whether this work item is still following the approved procedure version and what changed.
      prompt: resource:canon-agent-resource;canon-agent-prompt.txt
      conversationStarters:
        - What changed in my procedure and what do I need to redo?
        - Is this work item clear to close?
        - Who can check my re-attestation?
      actions:
        - canon-get-gate-status
        - canon-explain-delta
        - canon-get-approved-procedure
        - canon-create-reattest-checklist
        - canon-assign-checker
      skills:
        - canon-reattest
      followUpPrompt: Suggest up to three short next questions about this work item's procedure status, the changes to re-attest, or who can check the work. Never suggest marking items done or signing off.
  rovo:mcp:
    - key: canon-mcp
      name: Canon procedure tools
      tools:
        - canon-get-gate-status
        - canon-get-approved-procedure
  rovo:skill:
    - key: canon-reattest
      source:
        dir: skills/canon-reattest
      dependencies:
        tools:
          - canon-get-gate-status
          - canon-explain-delta
          - canon-create-reattest-checklist
          - canon-assign-checker
  jira:workflowValidator:
    - key: canon-gate
      name: Canon gate
      description: Blocks the transition while the bound Confluence procedure has a newer version than the one this work started under.
      function: canon-gate-fn
      projectTypes:
        - company-managed
        - team-managed
  jira:entityProperty:
    - key: canon-gate-property
      entityType: issue
      propertyKey: canon.gate
      values:
        - path: state
          type: string
          searchAlias: canonState
        - path: boundVersion
          type: number
          searchAlias: canonBoundVersion
        - path: bindingCount
          type: number
          searchAlias: canonBindingCount
  trigger:
    - key: canon-page-events
      function: page-events
      events:
        - avi:confluence:updated:page
        - avi:confluence:created:page
        - avi:confluence:archived:page
    - key: canon-issue-events
      function: issue-events
      events:
        - avi:jira:updated:issue
resources:
  - key: canon-agent-resource
    path: resources/agent
  - key: main
    path: src/frontend/index.tsx
  - key: byline
    path: src/frontend/byline.tsx
permissions:
  scopes:
    - read:page:confluence
    - read:confluence-content.summary
    - read:jira-work
    - write:jira-work
    - write:page:confluence
    - read:space:confluence
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/12bf2743-b147-41da-9c66-4f171fa7bdfd
  compatibility:
    jira:
      required: true
    confluence:
      required: false
